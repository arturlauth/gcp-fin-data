version: 2

models:
  - name: binance_btc_trades
    description: "Binance BTC/BRL trades — typed, deduplicated by trade_id, partitioned by trade_time."
    columns:
      - name: trade_id
        tests: [unique, not_null]
      - name: trade_time
        tests: [not_null]
      - name: price
        tests: [not_null]

  - name: tesouro_resultados
    description: "Resultados de leilões do Tesouro Nacional — deduplicated by num_edital."
    columns:
      - name: num_edital
        description: "Número identificador do edital de leilão."
        tests: [unique, not_null]
      - name: titulo
        description: "Tipo de título ofertado (ex: LFT, NTN-B)."
        tests: [not_null]
      - name: benchmark
        description: "Referência de prazo do título ofertado (ex: LFT 3 anos)."
      - name: tipo_leilao
        description: "Tipo de oferta (ex: Venda, Compra)."
      - name: data_vencimento
        description: "Data de vencimento do título."
        tests: [not_null]
      - name: data_leilao
        description: "Data de realização do leilão."
        tests: [not_null]
      - name: data_liquidacao
        description: "Data de liquidação financeira."
      - name: data_liquidacao_segunda_volta
        description: "Data de liquidação da segunda volta."
      - name: qtd_oferta
        description: "Quantidade de títulos ofertados."
      - name: qtd_oferta_segunda_volta
        description: "Quantidade ofertada na segunda volta."
      - name: qtd_aceita
        description: "Quantidade de títulos aceita no leilão."
      - name: qtd_aceita_segunda_volta
        description: "Quantidade aceita na segunda volta."
      - name: qtd_bcb
        description: "Quantidade aceita pelo Banco Central."
      - name: pct_taxa_media
        description: "Taxa de juros média aceita (% a.a.)."
      - name: pct_taxa_maxima
        description: "Taxa de juros máxima aceita (% a.a.)."
      - name: pu_medio
        description: "Preço unitário médio aceito."
      - name: pu_minimo
        description: "Preço unitário mínimo aceito."
      - name: financeiro_aceito
        description: "Volume financeiro aceito (R$)."
      - name: financeiro_aceito_segunda_volta
        description: "Volume financeiro aceito na segunda volta (R$)."
      - name: financeiro_bcb
        description: "Volume financeiro aceito pelo Banco Central (R$)."

  - name: tesouro_benchmarks
    description: "Períodos de referência de benchmark por título e vencimento."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [benchmark, titulo, data_vencimento, data_inicio, data_termino]
    columns:
      - name: benchmark
        description: "Identificação da referência de benchmark (ex: LFT 3 anos)."
        tests: [not_null]
      - name: titulo
        description: "Tipo de título referenciado (ex: LFT)."
      - name: data_vencimento
        description: "Data de vencimento do título referenciado."
        tests: [not_null]
      - name: data_inicio
        description: "Data de início do período de referência."
        tests: [not_null]
      - name: data_termino
        description: "Data de término do período de referência."

  - name: tesouro_calendario
    description: "Calendário oficial de leilões do Tesouro Nacional."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [benchmark, titulo, data_vencimento, data_leilao, tipo_leilao]
    columns:
      - name: titulo
        description: "Título ofertado (ex: LFT)."
        tests: [not_null]
      - name: benchmark
        description: "Referência do título ofertado."
      - name: data_vencimento
        description: "Data de vencimento do título ofertado."
        tests: [not_null]
      - name: data_leilao
        description: "Data de realização do leilão."
        tests: [not_null]
      - name: tipo_leilao
        description: "Tipo de oferta (ex: Venda)."

  - name: tesouro_comunicados
    description: "Comunicados oficiais do Tesouro Nacional — deduplicated by link."
    columns:
      - name: link
        description: "URL para download do comunicado."
        tests: [unique, not_null]
      - name: titulo
        description: "Título do comunicado."

  - name: bacen_meios_pagamento_mensal
    description: "Volumes mensais de meios de pagamento no Brasil — Pix, TED, Boleto, DOC, Cheque, TEC."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [data_referencia]
    columns:
      - name: data_referencia
        description: "Primeiro dia do mês de referência (ex: 2026-04-01)."
        tests: [not_null]
      - name: qtd_pix
        description: "Quantidade de transações Pix no mês."
      - name: val_pix
        description: "Valor total das transações Pix no mês."
      - name: qtd_ted
        description: "Quantidade de transferências TED no mês."
      - name: val_ted
        description: "Valor total das transferências TED no mês."
      - name: qtd_boleto
        description: "Quantidade de boletos liquidados no mês."
      - name: val_boleto
        description: "Valor total dos boletos liquidados no mês."
      - name: qtd_cheque
        description: "Quantidade de cheques compensados no mês."
      - name: val_cheque
        description: "Valor total dos cheques compensados no mês."
      - name: qtd_doc
        description: "Quantidade de transferências DOC no mês."
      - name: val_doc
        description: "Valor total das transferências DOC no mês."

  - name: bacen_expectativas_anuais
    description: "Expectativas de mercado anuais do BACEN Focus — mediana, média e dispersão por indicador e ano de referência."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [data_coleta, indicador, data_referencia]
    columns:
      - name: data_coleta
        description: "Data de publicação da pesquisa Focus."
        tests: [not_null]
      - name: indicador
        description: "Nome do indicador econômico (ex: IPCA, Câmbio, PIB Total)."
        tests: [not_null]
      - name: data_referencia
        description: "Ano de referência da expectativa (ex: 2026, 2027)."
        tests: [not_null]
      - name: mediana
        description: "Mediana das expectativas dos participantes."
      - name: media
        description: "Média das expectativas dos participantes."
      - name: desvio_padrao
        description: "Desvio padrão das expectativas."
      - name: minimo
        description: "Menor expectativa informada."
      - name: maximo
        description: "Maior expectativa informada."
      - name: num_respondentes
        description: "Número de instituições respondentes."

  - name: bacen_taxa_juros_mensal
    description: "Taxas de juros mensais por modalidade e instituição financeira — BACEN taxaJuros v2."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [data_referencia, modalidade, cnpj8]
    columns:
      - name: data_referencia
        description: "Primeiro dia do mês de referência da taxa (ex: 2026-03-01)."
        tests: [not_null]
      - name: modalidade
        description: "Modalidade de crédito (ex: Financiamento imobiliário com taxas de mercado - Prefixado)."
        tests: [not_null]
      - name: cnpj8
        description: "8 primeiros dígitos do CNPJ da instituição financeira."
        tests: [not_null]
      - name: instituicao_financeira
        description: "Nome da instituição financeira."
      - name: posicao
        description: "Posição do ranking da instituição no período."
      - name: pct_taxa_juros_mes
        description: "Taxa de juros ao mês (% a.m.)."
      - name: pct_taxa_juros_ano
        description: "Taxa de juros ao ano (% a.a.)."

  - name: bacen_ifdata_lista_relatorio
    description: "Catálogo de relatórios IFDATA disponíveis — referência estática, atualizada trimestralmente."
    columns:
      - name: num_relatorio
        description: "Identificador numérico do relatório IFDATA."
        tests: [unique, not_null]
      - name: nome_relatorio
        description: "Nome descritivo do relatório (ex: Resumo)."

  - name: bacen_ifdata_cadastro
    description: "Cadastro de instituições financeiras por segmento e tipo — BACEN IFDATA, snapshot trimestral."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cod_inst, data_referencia, td, sr]
    columns:
      - name: cod_inst
        description: "Código identificador da instituição (CNPJ8-like)."
        tests: [not_null]
      - name: data_referencia
        description: "Primeiro dia do mês de referência do cadastro (ex: 2024-12-01)."
        tests: [not_null]
      - name: nome_instituicao
        description: "Nome da instituição financeira."
      - name: data_inicio_atividade
        description: "Primeiro dia do mês de início de atividade da instituição."
      - name: tcb
        description: "Tipo de consolidado bancário (ex: B1)."
      - name: td
        description: "Tipo de documento de consolidação: I (individual) ou C (conglomerado)."
        tests: [not_null]
      - name: tc
        description: "Código numérico do tipo de consolidado."
      - name: segmento
        description: "Segmento prudencial da instituição (ex: Banco Múltiplo)."
      - name: uf
        description: "Unidade federativa da sede da instituição."
      - name: municipio
        description: "Município da sede da instituição."
      - name: sr
        description: "Segmento de porte (S1 a S5)."
        tests: [not_null]
      - name: cod_conglomerado_financeiro
        description: "Código do conglomerado financeiro ao qual pertence a instituição."
      - name: cod_conglomerado_prudencial
        description: "Código do conglomerado prudencial ao qual pertence a instituição."
      - name: cnpj_instituicao_lider
        description: "CNPJ8 da instituição líder do conglomerado."
      - name: situacao
        description: "Situação operacional da instituição: A (ativa) ou I (inativa)."

  - name: tesouro_dealers
    description: "Dealers primários do Tesouro Nacional por período — deduplicated by all columns."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [dealer, cnpj, data_inicio_periodo, data_fim_periodo]
    columns:
      - name: dealer
        description: "Nome da instituição financeira Dealer."
      - name: cnpj
        description: "CNPJ da instituição financeira."
        tests: [not_null]
      - name: data_inicio_periodo
        description: "Data de início do período como dealer primário."
        tests: [not_null]
      - name: data_fim_periodo
        description: "Data de fim do período como dealer primário."
